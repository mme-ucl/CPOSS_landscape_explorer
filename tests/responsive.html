<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CPOSS responsive verification</title>
<style>
  body { margin: 0; padding: 16px; background: #edeaf1; font: 14px system-ui; }
  label { font-weight: 650; }
  select { margin: 0 12px 12px 8px; padding: 6px; }
  iframe { display: block; height: 850px; width: 390px; border: 1px solid #aaa; background: white; }
</style>
<label for="viewport">Test viewport</label>
<select id="viewport">
  <option value="390">Phone · 390px</option>
  <option value="820">Tablet · 820px</option>
  <option value="1180">Desktop · 1180px</option>
</select>
<span>Exercise the actual navigator inside a viewport of the selected width.</span>
<iframe id="navigator" title="Navigator responsive test" src="../index.html?load=https://louiseprice.github.io/CPOSS_Database/0.Chemiscope/AspirinA.json"></iframe>
<script>
  document.getElementById('viewport').addEventListener('change', event => {
    document.getElementById('navigator').style.width = event.target.value + 'px';
  });
</script>
</html>
